name: MARK validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate release tree
        run: python scripts/validate_release.py

      - name: Run unit tests
        run: |
          python -m unittest tests/test_mark_runtime.py tests/test_notification_runtime.py tests/test_update_runtime.py -v

      - name: Build release package
        run: python scripts/build_release.py

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mark-beta-package
          path: |
            dist/MARK-*.zip
            dist/MARK-*.zip.sha256
